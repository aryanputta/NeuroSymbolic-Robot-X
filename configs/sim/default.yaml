# @package _global_
sim:
  backend: isaac  # isaac | pybullet | mock
  physics_dt: 0.01  # 100 Hz physics
  rendering_dt: 0.033  # ~30 Hz rendering
  gravity: [0.0, 0.0, -9.81]
  headless: true
  gpu_id: 0

  robot:
    name: franka_panda
    usd_path: assets/franka_panda/panda.usd
    base_position: [0.0, 0.0, 0.0]
    base_orientation: [0.0, 0.0, 0.0, 1.0]
    dof_names: [panda_joint1, panda_joint2, panda_joint3, panda_joint4, panda_joint5, panda_joint6, panda_joint7, panda_finger_joint1, panda_finger_joint2]
    max_effort: [87, 87, 87, 87, 12, 12, 12, 200, 200]
    max_velocity: [2.175, 2.175, 2.175, 2.175, 2.61, 2.61, 2.61, 0.2, 0.2]
    workspace:
      x_range: [-0.6, 0.6]
      y_range: [-0.6, 0.6]
      z_range: [0.0, 0.8]

  cameras:
    wrist_rgb:
      resolution: [224, 224]
      fov: 60.0
      near_clip: 0.01
      far_clip: 5.0
    overhead_rgb:
      resolution: [480, 640]
      fov: 80.0
      near_clip: 0.1
      far_clip: 10.0
    overhead_depth:
      resolution: [480, 640]
      fov: 80.0

  table:
    size: [1.2, 0.8, 0.05]
    position: [0.5, 0.0, 0.4]
    material: wood

  domain_randomization:
    enabled: false
    lighting_variation: 0.2
    texture_variation: 0.3
    friction_range: [0.3, 0.9]
    mass_variation: 0.15
    camera_noise_std: 0.01

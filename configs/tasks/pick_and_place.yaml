task:
  name: pick_and_place
  description: "Pick a target object and place it in the goal bin"
  difficulty: easy

  objects:
    - name: red_block
      type: cube
      size: [0.05, 0.05, 0.05]
      color: [1.0, 0.2, 0.2, 1.0]
      mass: 0.1
      spawn_region: {x: [0.3, 0.6], y: [-0.2, 0.2], z: [0.45, 0.45]}

    - name: bin_A
      type: bin
      size: [0.15, 0.15, 0.06]
      color: [0.2, 0.2, 0.8, 1.0]
      mass: 0.5
      spawn_region: {x: [0.55, 0.65], y: [0.2, 0.35], z: [0.42, 0.42]}
      is_static: true

  success_criteria:
    object: red_block
    target: bin_A
    position_tolerance: 0.05
    require_stable: true
    stable_steps: 10

  max_episode_steps: 300

  instruction_templates:
    - "Pick up the red block and place it in the blue bin."
    - "Move the red cube into the blue container."
    - "Grasp the red block and put it in bin A."

  reward_shaping:
    approach_bonus: 0.5
    grasp_bonus: 2.0
    lift_bonus: 1.0
    transport_bonus: 1.0
    place_bonus: 3.0
    success_bonus: 10.0

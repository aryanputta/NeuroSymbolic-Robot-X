# @package _global_
rl:
  algorithm: sac

  sac:
    policy: MlpPolicy
    buffer_size: 1_000_000
    learning_starts: 10_000
    batch_size: 256
    tau: 0.005
    gamma: 0.99
    train_freq: 1
    gradient_steps: 1
    optimize_memory_usage: false
    ent_coef: auto
    target_update_interval: 1
    target_entropy: auto
    use_sde: false
    sde_sample_freq: -1
    use_sde_at_warmup: false

    policy_kwargs:
      net_arch: [256, 256]
      activation_fn: relu

    learning_rate: 3.0e-4
    total_timesteps: 1_000_000

    log_interval: 10
    eval_freq: 50_000
    eval_episodes: 20
    save_freq: 100_000
    verbose: 1

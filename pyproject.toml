[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physai-rl-robot-x"
version = "0.1.0"
description = "Simulation-first embodied AI: hybrid VLA planning + RL execution for robust robot manipulation"
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    # Gym / RL
    "gymnasium>=0.29.0",
    # Numerics
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    # Vision
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    # Language / Planning
    "transformers>=4.35.0",
    "huggingface-hub>=0.19.0",
    "einops>=0.7.0",
    # RL libraries
    "stable-baselines3>=2.1.0",
    "tianshou>=1.0.0",
    # Config management
    "pyyaml>=6.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    # Experiment tracking
    "wandb>=0.16.0",
    "tensorboard>=2.14.0",
    # Utilities
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "jsonschema>=4.19.0",
    # Analysis / Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
isaac = [
    "isaacsim>=2023.1.0",
]
lerobot = [
    "lerobot>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[project.scripts]
physai-train = "src.training.trainer:main"
physai-eval = "src.evaluation.benchmark:main"
physai-benchmark = "src.evaluation.benchmark:run_full_benchmark"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
